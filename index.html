        // Generate realistic initial monthly schedule for November 2026 (30 days)
        function generateInitialMonthSchedule(nurses, year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const sched = {};
            const cyclePatterns = [
                ['P', 'P', 'P', 'P', 'P', 'L', 'L'], // Karu: Pagi Senin-Jumat, Libur Sabtu-Minggu
                ['P', 'P', 'S', 'S', 'M', 'L', 'L'], // Katim 1
                ['S', 'S', 'P', 'P', 'L', 'L', 'P'], // Katim 2
                ['M', 'L', 'L', 'P', 'P', 'S', 'S'], // Pelaksana 1
                ['P', 'S', 'M', 'L', 'L', 'P', 'S'], // Pelaksana 2
                ['S', 'M', 'L', 'L', 'P', 'S', 'M'], // Pelaksana 3
                ['P', 'P', 'S', 'S', 'M', 'L', 'L'], // Pelaksana 4
                ['M', 'L', 'L', 'P', 'S', 'M', 'L'], // Pelaksana 5
                ['P', 'P', 'P', 'P', 'S', 'L', 'L'], // CI
                ['C', 'C', 'C', 'C', 'C', 'L', 'L']  // Cuti awal bulan lalu dinas
            ];

            nurses.forEach((nurse, idx) => {
                sched[nurse.id] = {};
                const pat = cyclePatterns[idx % cyclePatterns.length];
                for (let d = 1; d <= daysInMonth; d++) {
                    if (nurse.status === 'Cuti' && d >= 15 && d <= 22) {
                        sched[nurse.id][d] = 'C';
                    } else {
                        sched[nurse.id][d] = pat[(d - 1) % pat.length];
                    }
                }
            });
            return sched;
        }

            fresh.schedules['2026-10'] = generateInitialMonthSchedule(fresh.nurses, 2026, 10);
            saveData(fresh);

        // Deteksi otomatis kesalahan jadwal: Shift Malam (M) langsung ke Shift Pagi (P) esok harinya
        function detectScheduleConflicts(year = appData.selectedYear, month = appData.selectedMonth) {
            const sched = ensureMonthSchedule(year, month);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const conflicts = []; // { nurseId, nurseName, dayFrom, dayTo }

            appData.nurses.forEach(nurse => {
                const nSched = sched[nurse.id] || {};
                for (let d = 1; d < daysInMonth; d++) {
                    if (nSched[d] === 'M' && nSched[d + 1] === 'P') {
                        conflicts.push({
                            nurseId: nurse.id,
                            nurseName: nurse.nama,
                            dayFrom: d,
                            dayTo: d + 1
                        });
                    }
                }
            });
            return conflicts;
        }

            const refDate = new Date(TODAY_STR);
            return appData.nurses.map(n => {

                const diffDays = Math.ceil((expDate - refDate) / (1000 * 60 * 60 * 24));
                return { ...n, diffDays };
            }).filter(n => n.diffDays <= 60);
        }

                        </div>
                        <div class="overflow-x-auto flex-1">
                            <table class="w-full text-left border-collapse">

                                    ${appData.nurses.map(n => {

                                        const sc = SHIFT_CONFIG[code] || SHIFT_CONFIG['L'];
                                        return `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3 px-4">
                                                <p class="font-bold text-slate-800">${n.nama}</p>
                                                <p class="text-[10px] text-slate-400">NIP. ${n.nip}</p>

                                <button onclick="switchTab('mutu')" class="text-xs font-bold text-brand-600 hover:underline">Detail</button>

                                ${appData.rtls.slice(0, 3).map(r => `

                                        <div class="flex items-start justify-between gap-2">
                                            <h4 class="text-xs font-extrabold text-slate-800 line-clamp-1">${r.judul}</h4>
                                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${r.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${r.status}</span>
                                        </div>

                                        <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-200/60 text-[10px] text-slate-500 font-semibold">
                                            <span>PIC: ${r.pic}</span>

                                        </div>

                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function cycleTodayShift(nurseId) {
            const sched = ensureMonthSchedule(2026, 10);
            const cur = sched[nurseId][TODAY_DAY] || 'L';
            const next = SHIFT_ORDER[(SHIFT_ORDER.indexOf(cur) + 1) % SHIFT_ORDER.length];
            sched[nurseId][TODAY_DAY] = next;
            saveData();
            renderCurrentTab();
            showToast(`Shift hari ini diubah menjadi ${SHIFT_CONFIG[next].label}`);
        }

        function openEditBorModal() {
            openModal(`
                <div class="p-6">
                    <h3 class="text-lg font-extrabold text-slate-800">Update BOR & Ketersediaan Tempat Tidur</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Ruang Dahlia — RSUD dr. Abdul Rivai</p>
                    <form onsubmit="saveBorUpdate(event)" class="space-y-4 mt-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Kapasitas Tempat Tidur Total</label>
                            <input type="number" id="input-kapasitas-bed" min="1" max="200" value="${appData.ruangan.kapasitasBed}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Jumlah Tempat Tidur Terisi Hari Ini</label>
                            <input type="number" id="input-terisi-bed" min="0" max="200" value="${appData.ruangan.terisiBed}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Simpan BOR</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveBorUpdate(e) {
            e.preventDefault();
            const kap = parseInt(document.getElementById('input-kapasitas-bed').value, 10);
            const terisi = parseInt(document.getElementById('input-terisi-bed').value, 10);
            if (terisi > kap) {
                showToast('Jumlah bed terisi tidak boleh melebihi kapasitas total!', 'error');
                return;
            }
            appData.ruangan.kapasitasBed = kap;
            appData.ruangan.terisiBed = terisi;
            saveData();
            closeModal();
            renderCurrentTab();
            showToast('Data BOR & keterisian bed berhasil diperbarui.');
        }

        function openQuickSupervisiFor(nurseName) {
            activeSupervisiSubTab = 'penilaian';
            switchTab('supervisi');
            setTimeout(() => {
                const sel = document.getElementById('sup-perawat');
                if (sel) sel.value = nurseName;
            }, 50);
        }

        // =========================================================================
        // MODUL 2: JADWAL DINAS & REKAP KEHADIRAN
        // =========================================================================
        function renderJadwal() {
            const year = appData.selectedYear;
            const month = appData.selectedMonth;
            const sched = ensureMonthSchedule(year, month);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const conflicts = detectScheduleConflicts(year, month);

            // Map conflict cells for quick red highlight
            const conflictCellSet = new Set();
            conflicts.forEach(c => {
                conflictCellSet.add(`${c.nurseId}-${c.dayFrom}`);
                conflictCellSet.add(`${c.nurseId}-${c.dayTo}`);
            });

            // Daily formation counters
            const dailyStats = [];
            for (let d = 1; d <= daysInMonth; d++) {
                let p = 0, s = 0, m = 0;
                appData.nurses.forEach(n => {
                    const code = sched[n.id]?.[d] || 'L';
                    if (code === 'P') p++;
                    else if (code === 'S') s++;
                    else if (code === 'M') m++;
                });
                dailyStats.push({ d, p, s, m });
            }

            return `
                <!-- Header Kontrol Jadwal -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs space-y-4">
                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div>
                            <h3 class="text-base sm:text-lg font-extrabold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-calendar-days text-brand-600"></i> Jadwal Dinas & Rekapitulasi Kehadiran Bulanan
                            </h3>
                            <p class="text-xs text-slate-500 mt-0.5">Klik pada sel tanggal untuk mengubah shift. Sistem otomatis mendeteksi bentrok Shift Malam (M) ke Pagi (P).</p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <!-- Filter Bulan & Tahun -->
                            <select onchange="changeSchedulePeriod(this.value, ${year})" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                                ${MONTH_NAMES.map((mName, idx) => `<option value="${idx}" ${idx === month ? 'selected' : ''}>${mName}</option>`).join('')}
                            </select>
                            <select onchange="changeSchedulePeriod(${month}, this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                                <option value="2025" ${year === 2025 ? 'selected' : ''}>2025</option>
                                <option value="2026" ${year === 2026 ? 'selected' : ''}>2026</option>
                                <option value="2027" ${year === 2027 ? 'selected' : ''}>2027</option>
                            </select>

                            <!-- Generate Pola Otomatis -->
                            <button onclick="openAutoPatternModal()" class="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs transition">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> Pola Otomatis
                            </button>

                            <!-- Tambah Perawat -->
                            <button onclick="openAddNurseModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-user-plus"></i> + Perawat
                            </button>

                            <!-- Ekspor CSV & Cetak -->
                            <button onclick="exportJadwalCSV()" class="px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-file-csv"></i> Ekspor CSV
                            </button>
                            <button onclick="selectedReportType='jadwal'; openDirectReport()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-print"></i> Cetak
                            </button>
                        </div>
                    </div>

                    <!-- Legenda Shift -->
                    <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-100 text-[11px]">
                        <span class="font-bold text-slate-500 mr-1">Legenda Shift:</span>
                        <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-bold border border-emerald-200">P = Pagi (07.00-14.00 • 7j)</span>
                        <span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800 font-bold border border-amber-200">S = Sore (14.00-21.00 • 7j)</span>
                        <span class="px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-800 font-bold border border-indigo-200">M = Malam (21.00-07.00 • 10j)</span>
                        <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-bold border border-slate-200">L = Libur / OFF</span>
                        <span class="px-2.5 py-1 rounded-lg bg-rose-100 text-rose-700 font-bold border border-rose-200">C = Cuti</span>
                        <span class="px-2.5 py-1 rounded-lg bg-purple-100 text-purple-700 font-bold border border-purple-200">Skt = Sakit</span>
                        <span class="px-2.5 py-1 rounded-lg bg-sky-100 text-sky-700 font-bold border border-sky-200">I = Izin</span>
                    </div>

                    <!-- Alert Deteksi Otomatis Kesalahan Jadwal (Malam ke Pagi) -->
                    ${conflicts.length > 0 ? `
                    <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-300 flex items-start gap-3">
                        <i class="fa-solid fa-circle-exclamation text-rose-600 text-base mt-0.5"></i>
                        <div class="text-xs text-rose-800">
                            <p class="font-extrabold">Peringatan Kesalahan Jadwal Terdeteksi (${conflicts.length} Bentrok Shift Malam ke Pagi)!</p>
                            <p class="mt-0.5">Perawat berikut dijadwalkan dinas <strong>Malam (M)</strong> langsung berlanjut <strong>Pagi (P)</strong> keesokan harinya (berisiko kelelahan klinis): 
                            ${conflicts.map(c => `<span class="underline font-bold">${c.nurseName}</span> (Tgl ${c.dayFrom}→${c.dayTo})`).join(', ')}.</p>
                        </div>
                    </div>
                    ` : `
                    <div class="p-2.5 px-3.5 rounded-xl bg-emerald-50/70 border border-emerald-200 flex items-center gap-2 text-xs text-emerald-800 font-semibold">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i>
                        <span>Validasi Jadwal Aman: Tidak ditemukan pelanggaran rotasi Shift Malam (M) langsung ke Shift Pagi (P).</span>
                    </div>
                    `}
                </div>

                <!-- Tabel Matriks Jadwal Bulanan -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse text-xs">
                            <thead>
                                <tr class="bg-brand-950 text-white">
                                    <th class="sticky left-0 z-10 bg-brand-950 py-3 px-3 text-left font-extrabold min-w-[200px] border-r border-white/10">Nama Perawat & Jabatan</th>
                                    ${Array.from({ length: daysInMonth }, (_, i) => {
                                        const d = i + 1;
                                        const dateObj = new Date(year, month, d);
                                        const dayName = DAY_NAMES[dateObj.getDay()];
                                        const isWeekend = dateObj.getDay() === 0 || dateObj.getDay() === 6;
                                        const isToday = (year === 2026 && month === 10 && d === TODAY_DAY);
                                        return `
                                        <th class="py-2 px-1 text-center min-w-[34px] border-r border-white/10 ${isToday ? 'bg-brand-600' : isWeekend ? 'bg-brand-900' : ''}">
                                            <div class="text-[9px] font-medium ${isWeekend ? 'text-amber-300' : 'text-slate-300'}">${dayName}</div>
                                            <div class="font-extrabold text-xs">${d}</div>
                                        </th>
                                        `;
                                    }).join('')}
                                    <th class="py-2 px-2 text-center bg-emerald-900 font-bold min-w-[32px]" title="Total Pagi">P</th>
                                    <th class="py-2 px-2 text-center bg-amber-900 font-bold min-w-[32px]" title="Total Sore">S</th>
                                    <th class="py-2 px-2 text-center bg-indigo-900 font-bold min-w-[32px]" title="Total Malam">M</th>
                                    <th class="py-2 px-2 text-center bg-slate-800 font-bold min-w-[32px]" title="Total Libur/Cuti">L</th>
                                    <th class="py-2 px-3 text-center bg-brand-900 font-extrabold min-w-[64px]" title="Total Jam Kerja">Jam</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${appData.nurses.map(nurse => {
                                    const nSched = sched[nurse.id] || {};
                                    let totP = 0, totS = 0, totM = 0, totL = 0, totHours = 0;

                                    const cellsHtml = Array.from({ length: daysInMonth }, (_, i) => {
                                        const d = i + 1;
                                        const code = nSched[d] || 'L';
                                        const sc = SHIFT_CONFIG[code] || SHIFT_CONFIG['L'];
                                        if (code === 'P') totP++;
                                        else if (code === 'S') totS++;
                                        else if (code === 'M') totM++;
                                        else totL++;
                                        totHours += sc.hours;

                                        const isConflict = conflictCellSet.has(`${nurse.id}-${d}`);
                                        const conflictClass = isConflict ? 'ring-2 ring-rose-600 bg-rose-200 text-rose-950 animate-pulse' : `${sc.bg} ${sc.text}`;

                                        return `
                                        <td class="p-1 text-center border-r border-slate-100">
                                            <button onclick="cycleCellShift('${nurse.id}', ${d})" title="${nurse.nama} • Tgl ${d}: ${sc.label} (Klik untuk ganti)" class="shift-cell w-7 h-7 rounded-lg font-extrabold text-[11px] flex items-center justify-center mx-auto ${conflictClass}">
                                                ${code}
                                            </button>
                                        </td>
                                        `;
                                    }).join('');

                                    return `
                                    <tr class="hover:bg-slate-50">
                                        <td class="sticky left-0 z-10 bg-white py-2.5 px-3 border-r border-slate-200">
                                            <div class="font-bold text-slate-800 truncate max-w-[190px]">${nurse.nama}</div>
                                            <div class="text-[10px] text-slate-500">${nurse.jabatan} • <span class="font-bold text-brand-700">${nurse.pk}</span></div>
                                        </td>
                                        ${cellsHtml}
                                        <td class="py-2 px-1.5 text-center font-bold bg-emerald-50/60 text-emerald-800">${totP}</td>
                                        <td class="py-2 px-1.5 text-center font-bold bg-amber-50/60 text-amber-800">${totS}</td>
                                        <td class="py-2 px-1.5 text-center font-bold bg-indigo-50/60 text-indigo-800">${totM}</td>
                                        <td class="py-2 px-1.5 text-center font-bold bg-slate-50 text-slate-600">${totL}</td>
                                        <td class="py-2 px-2 text-center font-extrabold bg-brand-50/70 text-brand-900">${totHours}j</td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                            <!-- Rekap Formasi Jaga Harian P / S / M di Bagian Bawah -->
                            <tfoot>
                                <tr class="bg-rose-50/80 border-t-2 border-slate-300 font-bold text-[10px]">
                                    <td class="sticky left-0 z-10 bg-rose-50 py-2.5 px-3 text-rose-900 font-extrabold border-r border-slate-200">
                                        Formasi Siaga Harian (P / S / M)
                                    </td>
                                    ${dailyStats.map(st => `
                                        <td class="py-2 px-0.5 text-center border-r border-rose-100 text-rose-900 leading-tight">
                                            <div>${st.p}/${st.s}/${st.m}</div>

        function applyAutoPattern(type) {
            const year = appData.selectedYear;

            const sched = {};
            const basePat = type === 'psml' ? ['P', 'P', 'S', 'S', 'M', 'L', 'L'] : ['P', 'S', 'M', 'L', 'L', 'P', 'S'];

            appData.nurses.forEach((nurse, idx) => {
                sched[nurse.id] = {};
                if (nurse.jabatan.includes('Kepala Ruangan')) {
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dayOfWeek = new Date(year, month, d).getDay();
                        sched[nurse.id][d] = (dayOfWeek === 0 || dayOfWeek === 6) ? 'L' : 'P';

                    const offset = idx * 2;
                    for (let d = 1; d <= daysInMonth; d++) {
                        sched[nurse.id][d] = basePat[(d - 1 + offset) % basePat.length];
                    }
                }
            });

            appData.schedules[getMonthKey(year, month)] = sched;
            saveData();
            closeModal();
            renderCurrentTab();

        // =========================================================================
        // MODUL 3: KALKULATOR BEBAN KERJA KEPERAWATAN (DOUGLAS, DEPKES, GILLIES, FTE)
        // =========================================================================
        let workloadFormState = {
            tanggal: TODAY_STR,
            minimal: 6,

        function calculateWorkload(method, minC, parC, totC, available) {
            const totalPasien = minC + parC + totC;
            let pagi = 0, sore = 0, malam = 0, totalKebutuhan = 0, lossDay = 0, nonNursing = 0, rumusDesc = '';

            if (method === 'Douglas') {
                // Standar Koefisien Douglas:
                // Minimal: P=0.17, S=0.14, M=0.07
                // Partial: P=0.27, S=0.15, M=0.10
                // Total:   P=0.36, S=0.30, M=0.20
                pagi = (minC * 0.17) + (parC * 0.27) + (totC * 0.36);
                sore = (minC * 0.14) + (parC * 0.15) + (totC * 0.30);
                malam = (minC * 0.07) + (parC * 0.10) + (totC * 0.20);
                const subtotal = pagi + sore + malam;
                lossDay = subtotal * 0.25; // Faktor libur/cuti (~25%)
                nonNursing = (subtotal + lossDay) * 0.25; // Tugas non-keperawatan 25%
                totalKebutuhan = subtotal + lossDay + nonNursing;
                rumusDesc = 'Koefisien Douglas per kategori pasien × 3 shift + Faktor Libur (25%) & Non-Nursing (25%)';
            } else if (method === 'Depkes') {
                // Standar Depkes RI (2005):
                // Minimal = 2 jam/hari, Partial = 3.08 jam/hari, Total = 4.15 jam/hari; Jam efektif perawat = 7 jam/hari
                const totalJamPerawatan = (minC * 2.0) + (parC * 3.08) + (totC * 4.15);
                const tenagaPokok = totalJamPerawatan / 7;
                // Loss day = (78 hari libur+cuti / 287 hari kerja efektif) * tenagaPokok
                lossDay = (78 / 287) * tenagaPokok;
                nonNursing = (tenagaPokok + lossDay) * 0.25;
                totalKebutuhan = tenagaPokok + lossDay + nonNursing;
                pagi = totalKebutuhan * 0.45;
                sore = totalKebutuhan * 0.35;
                malam = totalKebutuhan * 0.20;
                rumusDesc = 'Depkes RI: (Total Jam Perawatan ÷ 7 Jam Efektif) + Loss Day (78/287) + Non-Nursing (25%)';
            } else if (method === 'Gillies') {
                // Rumus Gillies (1994):
                // Jam perawatan: Minimal=2j, Partial=3j, Total=6j
                // Kebutuhan = (A x B x 365) / ((365 - C) x Jam Kerja/hari) -> C=76 hari libur, Jam=7
                const avgJamPerPasien = totalPasien > 0 ? ((minC * 2) + (parC * 3) + (totC * 6)) / totalPasien : 0;
                totalKebutuhan = (avgJamPerPasien * totalPasien * 365) / ((365 - 76) * 7);
                lossDay = totalKebutuhan * 0.21;
                nonNursing = totalKebutuhan * 0.20;
                pagi = totalKebutuhan * 0.47;
                sore = totalKebutuhan * 0.36;
                malam = totalKebutuhan * 0.17;
                rumusDesc = 'Gillies: (Jam Perawatan Rata-rata × Sensus × 365) ÷ ((365 - 76 Hari Libur) × 7 Jam)';
            } else {
                // Metode FTE (Full Time Equivalent):
                // Minimal=1.5j, Partial=3.5j, Total=5.5j; 1 FTE = 40 jam/minggu (5.71 jam/hari kalender)
                const totalJamHarian = (minC * 1.5) + (parC * 3.5) + (totC * 5.5);
                const baseFTE = (totalJamHarian * 7) / 40;
                lossDay = baseFTE * 0.18;
                nonNursing = baseFTE * 0.15;
                totalKebutuhan = baseFTE + lossDay + nonNursing;
                pagi = totalKebutuhan * 0.45;
                sore = totalKebutuhan * 0.35;
                malam = totalKebutuhan * 0.20;
                rumusDesc = 'FTE: (Total Jam Asuhan Mingguan ÷ 40 Jam Kerja Standar/Minggu) + Cadangan Cuti & Administrasi';
            }

            const gap = available - totalKebutuhan;
            return {
                totalPasien,
                totalKebutuhan: Number(totalKebutuhan.toFixed(1)),
                pagiExact: Number(pagi.toFixed(2)),
                soreExact: Number(sore.toFixed(2)),
                malamExact: Number(malam.toFixed(2)),
                pagiRound: Math.ceil(pagi),
                soreRound: Math.ceil(sore),
                malamRound: Math.ceil(malam),
                lossDay: Number(lossDay.toFixed(2)),
                nonNursing: Number(nonNursing.toFixed(2)),
                gap: Number(gap.toFixed(1)),
                rumusDesc
            };
        }

            const newSup = {
                id: 'sup' + Date.now(),
                tanggal,
                jadwalBerikutnya: '2026-12-03',
                perawat,
                topik,
                skor,
                temuan,
                rekomendasi,
                statusTindakLanjut: autoRtl ? 'Sudah Masuk RTL' : 'Menunggu Tindak Lanjut'

                            const barWidth = q.tipe === 'max' ? Math.min(100, Math.max(2, pct * 10)) : Math.min(100, pct);

                            return `
                            <div class="space-y-1">
                                <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                                    <div class="flex items-center gap-2">
                                        <span class="px-2 py-0.5 rounded bg-brand-50 text-brand-700 font-extrabold text-[10px]">${q.kode}</span>

                                        <span class="text-[11px] text-slate-400">(${q.kategori})</span>
                                    </div>
                                    <div class="flex items-center gap-2 font-bold">

                </div>

                <!-- Tabel Rincian Data & Analisis Mutu Ruangan -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <h4 class="text-sm font-extrabold text-slate-800">Rincian Data & Analisis Mutu Ruang Dahlia</h4>
                        <div class="relative w-full sm:w-64">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" value="${mutuSearchQuery}" oninput="mutuSearchQuery=this.value; renderCurrentTab()" placeholder="Cari indikator mutu..." class="w-full pl-8 pr-3 py-1.5 rounded-xl border border-slate-300 text-xs outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-extrabold text-slate-500 uppercase">
                                    <th class="py-3 px-4 min-w-[220px]">Kode & Indikator Mutu</th>
                                    <th class="py-3 px-3 text-center">Target</th>
                                    <th class="py-3 px-3 text-center">Num / Den</th>
                                    <th class="py-3 px-3 text-center">Capaian</th>
                                    <th class="py-3 px-3 text-center">Status</th>
                                    <th class="py-3 px-4 min-w-[240px]">Analisis & Tindak Lanjut</th>
                                    <th class="py-3 px-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filtered.map(q => {
                                    const pct = q.denominator > 0 ? Number(((q.numerator / q.denominator) * 100).toFixed(2)) : 0;
                                    const achieved = q.tipe === 'min' ? pct >= q.target : pct <= q.target;

                                    return `
                                    <tr class="hover:bg-slate-50/80">
                                        <td class="py-3.5 px-4">
                                            <span class="px-2 py-0.5 rounded bg-brand-50 text-brand-700 font-extrabold text-[10px]">${q.kode}</span>
                                            <p class="font-bold text-slate-800 mt-1">${q.nama}</p>
                                            <p class="text-[10px] text-slate-400">${q.kategori}</p>
                                        </td>
                                        <td class="py-3.5 px-3 text-center font-extrabold text-slate-700">${q.tipe === 'max' ? '≤' : ''}${q.target}%</td>
                                        <td class="py-3.5 px-3 text-center font-semibold text-slate-600">${q.numerator} / ${q.denominator}</td>
                                        <td class="py-3.5 px-3 text-center font-extrabold ${achieved ? 'text-emerald-600' : 'text-rose-600'}">${pct}%</td>
                                        <td class="py-3.5 px-3 text-center">
                                            <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ${achieved ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                                ${achieved ? 'Tercapai' : 'Perlu Evaluasi'}
                                            </span>
                                        </td>
                                        <td class="py-3.5 px-4">
                                            <p class="font-semibold text-slate-700 line-clamp-2">${q.analisis}</p>
                                            <p class="text-[11px] text-brand-700 mt-0.5 line-clamp-1"><strong>RTL:</strong> ${q.rtl}</p>
                                        </td>
                                        <td class="py-3.5 px-4 text-right whitespace-nowrap">
                                            <button onclick="openEditMutuModal('${q.id}')" class="p-1.5 rounded-lg text-slate-500 hover:bg-brand-50 hover:text-brand-700 transition" title="Input Num/Den & Edit">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openEditMutuModal(id) {
            const q = appData.qualityIndicators.find(item => item.id === id);
            if (!q) return;
            openModal(`
                <div class="p-6">
                    <span class="px-2.5 py-0.5 rounded bg-brand-50 text-brand-700 font-extrabold text-xs">${q.kode}</span>
                    <h3 class="text-lg font-extrabold text-slate-800 mt-1">${q.nama}</h3>
                    <p class="text-xs text-slate-500">Target Standar: <strong>${q.tipe === 'max' ? '≤' : '≥'} ${q.target}%</strong></p>

                    <form onsubmit="saveEditMutu(event, '${q.id}')" class="space-y-4 mt-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Numerator (Pembilang)</label>
                                <input type="number" id="edit-mutu-num" min="0" value="${q.numerator}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm font-extrabold text-brand-700 outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Denominator (Penyebut)</label>
                                <input type="number" id="edit-mutu-den" min="1" value="${q.denominator}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm font-extrabold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Analisis Capaian Ruangan</label>
                            <textarea id="edit-mutu-analisis" rows="2" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">${q.analisis}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Rencana Tindak Lanjut (RTL) Mutu</label>
                            <textarea id="edit-mutu-rtl" rows="2" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">${q.rtl}</textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Hitung & Simpan Capaian</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveEditMutu(e, id) {
            e.preventDefault();
            const q = appData.qualityIndicators.find(item => item.id === id);
            if (!q) return;
            q.numerator = parseInt(document.getElementById('edit-mutu-num').value, 10) || 0;
            q.denominator = Math.max(1, parseInt(document.getElementById('edit-mutu-den').value, 10) || 1);
            q.analisis = document.getElementById('edit-mutu-analisis').value.trim();
            q.rtl = document.getElementById('edit-mutu-rtl').value.trim();
            saveData();
            closeModal();
            renderCurrentTab();
            showToast(`Capaian indikator ${q.kode} berhasil diperbarui.`);
        }

        function openAddMutuModal() {
            openModal(`
                <div class="p-6">
                    <h3 class="text-lg font-extrabold text-slate-800">Tambah Indikator Mutu Baru</h3>
                    <form onsubmit="saveNewMutu(event)" class="space-y-4 mt-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Kode Indikator</label>
                                <input type="text" id="new-mutu-kode" placeholder="MUTU-04" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Target (%)</label>
                                <input type="number" id="new-mutu-target" value="100" min="0" max="100" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Indikator Mutu</label>
                            <input type="text" id="new-mutu-nama" placeholder="Contoh: Kepatuhan Waktu Visite Dokter Spesialis" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Numerator</label>
                                <input type="number" id="new-mutu-num" value="45" min="0" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Denominator</label>
                                <input type="number" id="new-mutu-den" value="50" min="1" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Analisis & Tindak Lanjut</label>
                            <input type="text" id="new-mutu-analisis" placeholder="Catatan evaluasi..." required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Simpan Indikator</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveNewMutu(e) {
            e.preventDefault();
            appData.qualityIndicators.push({
                id: 'mutu' + Date.now(),
                kode: document.getElementById('new-mutu-kode').value.trim(),
                kategori: 'Mutu Unit Dahlia',
                nama: document.getElementById('new-mutu-nama').value.trim(),
                target: parseFloat(document.getElementById('new-mutu-target').value) || 100,
                numerator: parseInt(document.getElementById('new-mutu-num').value, 10) || 0,
                denominator: Math.max(1, parseInt(document.getElementById('new-mutu-den').value, 10) || 1),
                tipe: 'min',
                analisis: document.getElementById('new-mutu-analisis').value.trim(),
                rtl: 'Monitoring berkala setiap minggu oleh Kepala Ruangan.'
            });
            saveData();
            closeModal();
            renderCurrentTab();
            showToast('Indikator mutu baru berhasil ditambahkan.');
        }

        // =========================================================================
        // MODUL 6: RENCANA KERJA & TINDAK LANJUT (RTL)
        // =========================================================================
        let rtlSearch = '';
        let rtlCategoryFilter = 'Semua';
        let rtlStatusFilter = 'Semua';

        function renderRTL() {
            const filtered = appData.rtls.filter(r => {
                const matchSearch = r.judul.toLowerCase().includes(rtlSearch.toLowerCase()) ||
                    r.pic.toLowerCase().includes(rtlSearch.toLowerCase()) ||
                    r.masalah.toLowerCase().includes(rtlSearch.toLowerCase());
                const matchCat = rtlCategoryFilter === 'Semua' || r.kategori === rtlCategoryFilter;
                const matchStat = rtlStatusFilter === 'Semua' || r.status === rtlStatusFilter;
                return matchSearch && matchCat && matchStat;
            });

            return `
                <!-- Header & Filter Rencana Kerja -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h3 class="text-base sm:text-lg font-extrabold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-brand-600"></i> Rencana Kerja Bulanan & Rencana Tindak Lanjut (RTL)
                            </h3>
                            <p class="text-xs text-slate-500 mt-0.5">Matriks pemecahan masalah, penetapan PIC penanggung jawab, monitoring progres perbaikan, dan eviden pelaksanaan.</p>
                        </div>
                        <button onclick="openAddRTLModal()" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-extrabold flex items-center gap-2 shadow-xs shrink-0 transition">
                            <i class="fa-solid fa-plus"></i> Tambah Rencana Kerja
                        </button>
                    </div>

                    <!-- Filter Bar -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 pt-2">
                        <div class="sm:col-span-6 relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" value="${rtlSearch}" oninput="rtlSearch=this.value; renderCurrentTab()" placeholder="Cari program, PIC, atau tindakan..." class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-300 text-xs outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div class="sm:col-span-3">
                            <select onchange="rtlCategoryFilter=this.value; renderCurrentTab()" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 outline-none">
                                <option value="Semua" ${rtlCategoryFilter === 'Semua' ? 'selected' : ''}>Semua Kategori</option>
                                <option value="SDM" ${rtlCategoryFilter === 'SDM' ? 'selected' : ''}>SDM</option>
                                <option value="Fasilitas & Alat" ${rtlCategoryFilter === 'Fasilitas & Alat' ? 'selected' : ''}>Fasilitas & Alat</option>
                                <option value="Pelayanan" ${rtlCategoryFilter === 'Pelayanan' ? 'selected' : ''}>Pelayanan</option>
                                <option value="Administrasi" ${rtlCategoryFilter === 'Administrasi' ? 'selected' : ''}>Administrasi</option>
                            </select>
                        </div>
                        <div class="sm:col-span-3">
                            <select onchange="rtlStatusFilter=this.value; renderCurrentTab()" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 outline-none">
                                <option value="Semua" ${rtlStatusFilter === 'Semua' ? 'selected' : ''}>Semua Status</option>
                                <option value="Dalam Proses" ${rtlStatusFilter === 'Dalam Proses' ? 'selected' : ''}>Dalam Proses</option>
                                <option value="Selesai" ${rtlStatusFilter === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                <option value="Tertunda" ${rtlStatusFilter === 'Tertunda' ? 'selected' : ''}>Tertunda</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Grid Kartu RTL -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    ${filtered.map(r => `
                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs hover:shadow-md transition flex flex-col justify-between space-y-4">
                            <div class="space-y-3">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="px-2.5 py-0.5 rounded-md bg-brand-50 text-brand-700 border border-brand-200 text-[10px] font-extrabold uppercase tracking-wider">${r.kategori}</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${r.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : r.status === 'Tertunda' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800'}">
                                        ${r.status}
                                    </span>
                                </div>

                                <h4 class="text-base font-extrabold text-slate-800 leading-snug">${r.judul}</h4>

                                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/60 space-y-2 text-xs">
                                    <div>
                                        <span class="text-[10px] font-extrabold uppercase text-slate-400 block">Permasalahan:</span>
                                        <p class="text-slate-700 mt-0.5">${r.masalah}</p>
                                    </div>
                                    <div class="pt-1.5 border-t border-slate-200/60">
                                        <span class="text-[10px] font-extrabold uppercase text-brand-700 block">Rencana Tindakan:</span>
                                        <p class="text-slate-700 mt-0.5">${r.tindakan}</p>
                                    </div>
                                </div>

                                <div class="flex items-start gap-2 text-xs text-slate-600 bg-emerald-50/50 p-2.5 rounded-xl border border-emerald-100">
                                    <i class="fa-solid fa-paperclip text-brand-600 mt-0.5"></i>
                                    <div>
                                        <span class="font-bold text-slate-700">Eviden:</span> <span class="italic">${r.eviden || 'Belum ada eviden diunggah'}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Interactive Progress Slider & Footer -->
                            <div class="space-y-3 pt-2 border-t border-slate-100">
                                <div>
                                    <div class="flex items-center justify-between text-xs mb-1">
                                        <span class="font-bold text-slate-600">Progres Pelaksanaan (Geser untuk update):</span>
                                        <span class="font-extrabold text-brand-700">${r.progres}%</span>
                                    </div>
                                    <input type="range" min="0" max="100" step="5" value="${r.progres}" onchange="updateRTLProgress('${r.id}', this.value)" class="w-full accent-brand-600 cursor-pointer h-2 bg-slate-200 rounded-lg">
                                </div>

                                <div class="flex items-center justify-between text-[11px] text-slate-500 font-semibold">
                                    <div>
                                        <span>PIC: <strong class="text-slate-700">${r.pic}</strong></span>
                                        <span class="mx-1.5">•</span>
                                        <span>Tenggat: <strong class="text-slate-700">${r.tenggat}</strong></span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button onclick="openEditRTLModal('${r.id}')" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-brand-700" title="Edit RTL">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button onclick="deleteRTL('${r.id}')" class="p-1.5 rounded-lg text-slate-400 hover:bg-rose-50 hover:text-rose-600" title="Hapus RTL">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function updateRTLProgress(id, val) {
            const item = appData.rtls.find(r => r.id === id);
            if (!item) return;
            item.progres = parseInt(val, 10);
            item.status = item.progres === 100 ? 'Selesai' : 'Dalam Proses';
            saveData();
            renderCurrentTab();
            showToast(`Progres "${item.judul}" diperbarui menjadi ${item.progres}%.`);
        }

        function openAddRTLModal(editItem = null) {
            const isEdit = !!editItem;
            openModal(`
                <div class="p-6">
                    <h3 class="text-lg font-extrabold text-slate-800">${isEdit ? 'Edit Rencana Kerja / RTL' : 'Tambah Rencana Kerja & RTL Baru'}</h3>
                    <form onsubmit="saveRTLForm(event, ${isEdit ? `'${editItem.id}'` : 'null'})" class="space-y-4 mt-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Kategori</label>
                                <select id="rtl-kategori" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold outline-none">
                                    ${['SDM', 'Fasilitas & Alat', 'Pelayanan', 'Administrasi'].map(c => `<option ${editItem?.kategori === c ? 'selected' : ''}>${c}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Tenggat Waktu</label>
                                <input type="date" id="rtl-tenggat" value="${editItem?.tenggat || '2026-12-10'}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Judul Rencana Kerja / Program</label>
                            <input type="text" id="rtl-judul" value="${editItem?.judul || ''}" placeholder="Contoh: Optimalisasi Kepatuhan Cuci Tangan 5 Momen" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Permasalahan yang Ditemukan</label>
                            <textarea id="rtl-masalah" rows="2" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">${editItem?.masalah || ''}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Rencana Tindakan Perbaikan</label>
                            <textarea id="rtl-tindakan" rows="2" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">${editItem?.tindakan || ''}</textarea>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">PIC Penanggung Jawab</label>
                                <input type="text" id="rtl-pic" value="${editItem?.pic || 'Ns. Ahmad Fauzi, S.Kep'}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Dokumentasi Eviden / Bukti</label>
                                <input type="text" id="rtl-eviden" value="${editItem?.eviden || ''}" placeholder="Link foto / nomor dokumen bukti..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Simpan Rencana Kerja</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function openEditRTLModal(id) {
            const item = appData.rtls.find(r => r.id === id);
            if (item) openAddRTLModal(item);
        }

        function saveRTLForm(e, editId) {
            e.preventDefault();
            const payload = {
                kategori: document.getElementById('rtl-kategori').value,
                tenggat: document.getElementById('rtl-tenggat').value,
                judul: document.getElementById('rtl-judul').value.trim(),
                masalah: document.getElementById('rtl-masalah').value.trim(),
                tindakan: document.getElementById('rtl-tindakan').value.trim(),
                pic: document.getElementById('rtl-pic').value.trim(),
                eviden: document.getElementById('rtl-eviden').value.trim()
            };

            if (editId) {
                const idx = appData.rtls.findIndex(r => r.id === editId);
                if (idx !== -1) appData.rtls[idx] = { ...appData.rtls[idx], ...payload };
            } else {
                appData.rtls.unshift({
                    id: 'rtl' + Date.now(),
                    ...payload,
                    progres: 0,
                    status: 'Dalam Proses'
                });
            }
            saveData();
            closeModal();
            renderCurrentTab();
            showToast('Rencana kerja & RTL berhasil disimpan.');
        }

        function deleteRTL(id) {
            appData.rtls = appData.rtls.filter(r => r.id !== id);

        function generateOfficialReportTableHTML() {
            if (selectedReportType === 'sdm') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">

                                <th class="border border-slate-400 py-2 px-2 text-center">Jenjang</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Jabatan</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Expiry STR</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Status</th>
                            </tr>
                        </thead>

                            ${appData.nurses.map((n, i) => `

                                    <td class="border border-slate-400 py-1.5 px-3">${n.nip}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${n.pendidikan}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${n.pk}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${n.jabatan}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${n.strExp}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${n.status}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'jadwal') {
                const sched = ensureMonthSchedule();
                const daysInMonth = new Date(appData.selectedYear, appData.selectedMonth + 1, 0).getDate();
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Nama Perawat</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Jabatan</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Shift Pagi</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Shift Sore</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Shift Malam</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Libur/Cuti</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Total Jam</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.nurses.map((n, i) => {
                                let p = 0, s = 0, m = 0, l = 0, jam = 0;
                                for (let d = 1; d <= daysInMonth; d++) {
                                    const code = sched[n.id]?.[d] || 'L';
                                    if (code === 'P') p++;
                                    else if (code === 'S') s++;
                                    else if (code === 'M') m++;
                                    else l++;
                                    jam += (SHIFT_CONFIG[code]?.hours || 0);
                                }
                                return `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${n.nama}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${n.jabatan}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${p}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${s}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${m}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${l}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${jam} Jam</td>
                                </tr>
                                `;

                    </table>
                `;
            } else if (selectedReportType === 'beban') {
                return `

                                <th class="border border-slate-400 py-2 px-3 text-center">Sensus Pasien</th>
                                <th class="border border-slate-400 py-2 px-3 text-center">Kebutuhan (24j)</th>
                                <th class="border border-slate-400 py-2 px-3 text-center">Tersedia</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Analisis Kepala Ruangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.workloadHistory.map((w, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${w.tanggal}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center">${w.metode}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center">${w.totalPasien} Pasien</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center font-bold">${w.kebutuhan} Perawat</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center">${w.riil} Orang</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${w.catatan}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'supervisi') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Tanggal</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Perawat Disupervisi</th>

                                <th class="border border-slate-400 py-2 px-2 text-center">Skor</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Temuan & Rekomendasi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.supervisions.map((s, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${s.tanggal}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${s.perawat}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${s.topik}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${s.skor}%</td>
                                    <td class="border border-slate-400 py-1.5 px-3"><strong>Temuan:</strong> ${s.temuan}<br><strong>Rekom:</strong> ${s.rekomendasi}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'mutu') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">Kode</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Indikator Mutu Ruangan</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Target</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Num/Den</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Capaian</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Analisis & Tindak Lanjut</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.qualityIndicators.map(q => {
                                const pct = q.denominator > 0 ? ((q.numerator / q.denominator) * 100).toFixed(2) : 0;
                                return `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${q.kode}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${q.nama}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${q.target}%</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${q.numerator}/${q.denominator}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${pct}%</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${q.analisis} — <em>RTL: ${q.rtl}</em></td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'rtl') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Kategori & Program Kerja</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Rencana Tindakan</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">PIC & Tenggat</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Progres</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.rtls.map((r, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3"><strong>[${r.kategori}]</strong> ${r.judul}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${r.tindakan}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${r.pic} (${r.tenggat})</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${r.progres}% (${r.status})</td>
                                </tr>

                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">

                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Area Audit Kepatuhan Internal</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Standar Penilaian</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Hasil</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Catatan Evaluasi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.audits.map((a, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${a.area}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${a.standar}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${a.sesuai ? 'Sesuai' : 'Perlu Perbaikan'}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${a.catatan}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        function exportSelectedReportCSV() {
            if (selectedReportType === 'jadwal') {
                exportJadwalCSV();
                return;
            }
            let csvLines = [];
            if (selectedReportType === 'sdm') {
                csvLines.push('No,Nama Lengkap,NIP,Pendidikan,Jenjang Klinis,Jabatan,No STR,Expiry STR,Status');
                appData.nurses.forEach((n, i) => {
                    csvLines.push(`${i + 1},"${n.nama}","${n.nip}","${n.pendidikan}",${n.pk},"${n.jabatan}",${n.strNo},${n.strExp},${n.status}`);
                });
            } else if (selectedReportType === 'mutu') {
                csvLines.push('Kode,Indikator Mutu,Target,Numerator,Denominator,Capaian (%),Analisis,RTL');
                appData.qualityIndicators.forEach(q => {
                    const pct = q.denominator > 0 ? ((q.numerator / q.denominator) * 100).toFixed(2) : 0;
                    csvLines.push(`${q.kode},"${q.nama}",${q.target},${q.numerator},${q.denominator},${pct},"${q.analisis}","${q.rtl}"`);
                });
            } else if (selectedReportType === 'rtl') {
                csvLines.push('Kategori,Judul Program,Permasalahan,Rencana Tindakan,PIC,Tenggat,Progres (%),Status');
                appData.rtls.forEach(r => {
                    csvLines.push(`"${r.kategori}","${r.judul}","${r.masalah}","${r.tindakan}","${r.pic}",${r.tenggat},${r.progres},${r.status}`);
                });
            } else {
                csvLines.push('Tanggal,Metode/Topik,Detail,Hasil');
                appData.supervisions.forEach(s => {
                    csvLines.push(`${s.tanggal},"${s.topik}","${s.perawat}",${s.skor}%`);
                });
            }
            downloadCSV(csvLines.join('\n'), `Laporan_Resmi_Ruang_Dahlia_${selectedReportType.toUpperCase()}_2026.csv`);
        }

        function downloadCSV(content, filename) {
            const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`File ${filename} berhasil diekspor!`);
        }

        // =========================================================================
        // 4. INITIALIZATION ON WINDOW LOAD
        // =========================================================================
        window.onload = function () {
            switchTab('dashboard');
        };
    </script>
