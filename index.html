        // Generate realistic initial monthly schedule for November 2026 (30 days)
        function generateInitialMonthSchedule(nurses, year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const sched = {};
            const cyclePatterns = [
                ['P', 'P', 'P', 'P', 'P', 'L', 'L'], // Karu: Pagi Senin-Jumat, Libur Sabtu-Minggu
                ['P', 'P', 'S', 'S', 'M', 'L', 'L'], // Katim 1
                ['S', 'S', 'P', 'P', 'L', 'L', 'P'], // Katim 2
                ['M', 'L', 'L', 'P', 'P', 'S', 'S'], // Pelaksana 1
                ['P', 'S', 'M', 'L', 'L', 'P', 'S'], // Pelaksana 2
                ['S', 'M', 'L', 'L', 'P', 'S', 'M'], // Pelaksana 3
                ['P', 'P', 'S', 'S', 'M', 'L', 'L'], // Pelaksana 4
                ['M', 'L', 'L', 'P', 'S', 'M', 'L'], // Pelaksana 5
                ['P', 'P', 'P', 'P', 'S', 'L', 'L'], // CI
                ['C', 'C', 'C', 'C', 'C', 'L', 'L']  // Cuti awal bulan lalu dinas
            ];

            nurses.forEach((nurse, idx) => {
                sched[nurse.id] = {};
                const pat = cyclePatterns[idx % cyclePatterns.length];
                for (let d = 1; d <= daysInMonth; d++) {
                    if (nurse.status === 'Cuti' && d >= 15 && d <= 22) {
                        sched[nurse.id][d] = 'C';
                    } else {
                        sched[nurse.id][d] = pat[(d - 1) % pat.length];
                    }
                }
            });
            return sched;
        }

        // Deteksi otomatis kesalahan jadwal: Shift Malam (M) langsung ke Shift Pagi (P) esok harinya
        function detectScheduleConflicts(year = appData.selectedYear, month = appData.selectedMonth) {
            const sched = ensureMonthSchedule(year, month);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const conflicts = []; // { nurseId, nurseName, dayFrom, dayTo }

            appData.nurses.forEach(nurse => {
                const nSched = sched[nurse.id] || {};
                for (let d = 1; d < daysInMonth; d++) {
                    if (nSched[d] === 'M' && nSched[d + 1] === 'P') {
                        conflicts.push({
                            nurseId: nurse.id,
                            nurseName: nurse.nama,
                            dayFrom: d,
                            dayTo: d + 1
                        });
                    }
                }
            });
            return conflicts;
        }

            }).filter(n => n.diffDays <= 60);
        }

                : type === 'warning'

            const icon = type === 'success' ? 'fa-circle-check text-brand-400' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-exclamation';

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border ${colors} text-xs sm:text-sm font-semibold transform transition-all duration-300 translate-y-4 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // =========================================================================
        // MODUL 6: RENCANA KERJA & TINDAK LANJUT (RTL)
        // =========================================================================
        let rtlSearch = '';
        let rtlCategoryFilter = 'Semua';
        let rtlStatusFilter = 'Semua';

        function renderRTL() {
            const filtered = appData.rtls.filter(r => {
                const matchSearch = r.judul.toLowerCase().includes(rtlSearch.toLowerCase()) ||
                    r.pic.toLowerCase().includes(rtlSearch.toLowerCase()) ||
                    r.masalah.toLowerCase().includes(rtlSearch.toLowerCase());
                const matchCat = rtlCategoryFilter === 'Semua' || r.kategori === rtlCategoryFilter;
                const matchStat = rtlStatusFilter === 'Semua' || r.status === rtlStatusFilter;
                return matchSearch && matchCat && matchStat;

            return `
                <!-- Header & Filter Rencana Kerja -->

                        <button onclick="openAddRTLModal()" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-extrabold flex items-center gap-2 shadow-xs shrink-0 transition">

                            <input type="text" value="${rtlSearch}" oninput="rtlSearch=this.value; renderCurrentTab()" placeholder="Cari program, PIC, atau tindakan..." class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-300 text-xs outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div class="sm:col-span-3">
                            <select onchange="rtlCategoryFilter=this.value; renderCurrentTab()" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 outline-none">

                                <option value="Administrasi" ${rtlCategoryFilter === 'Administrasi' ? 'selected' : ''}>Administrasi</option>
                            </select>
                        </div>
                        <div class="sm:col-span-3">
                            <select onchange="rtlStatusFilter=this.value; renderCurrentTab()" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 outline-none">

                                <option value="Dalam Proses" ${rtlStatusFilter === 'Dalam Proses' ? 'selected' : ''}>Dalam Proses</option>
                                <option value="Selesai" ${rtlStatusFilter === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                <option value="Tertunda" ${rtlStatusFilter === 'Tertunda' ? 'selected' : ''}>Tertunda</option>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs hover:shadow-md transition flex flex-col justify-between space-y-4">
                            <div class="space-y-3">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="px-2.5 py-0.5 rounded-md bg-brand-50 text-brand-700 border border-brand-200 text-[10px] font-extrabold uppercase tracking-wider">${r.kategori}</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${r.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : r.status === 'Tertunda' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800'}">

                                </div>

                                        <p class="text-slate-700 mt-0.5">${r.masalah}</p>
                                    </div>
                                    <div class="pt-1.5 border-t border-slate-200/60">
                                        <span class="text-[10px] font-extrabold uppercase text-brand-700 block">Rencana Tindakan:</span>
                                        <p class="text-slate-700 mt-0.5">${r.tindakan}</p>
                                    </div>
                                </div>

                                <div class="flex items-start gap-2 text-xs text-slate-600 bg-emerald-50/50 p-2.5 rounded-xl border border-emerald-100">
                                    <i class="fa-solid fa-paperclip text-brand-600 mt-0.5"></i>
                                    <div>
                                        <span class="font-bold text-slate-700">Eviden:</span> <span class="italic">${r.eviden || 'Belum ada eviden diunggah'}</span>
                                    </div>

                            </div>

                                        <span class="font-bold text-slate-600">Progres Pelaksanaan (Geser untuk update):</span>
                                        <span class="font-extrabold text-brand-700">${r.progres}%</span>
                                    </div>
                                    <input type="range" min="0" max="100" step="5" value="${r.progres}" onchange="updateRTLProgress('${r.id}', this.value)" class="w-full accent-brand-600 cursor-pointer h-2 bg-slate-200 rounded-lg">

                                <div class="flex items-center justify-between text-[11px] text-slate-500 font-semibold">

                                        <span>PIC: <strong class="text-slate-700">${r.pic}</strong></span>

                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function updateRTLProgress(id, val) {
            const item = appData.rtls.find(r => r.id === id);
            if (!item) return;
            item.progres = parseInt(val, 10);
            item.status = item.progres === 100 ? 'Selesai' : 'Dalam Proses';
            saveData();
            renderCurrentTab();
            showToast(`Progres "${item.judul}" diperbarui menjadi ${item.progres}%.`);
        }

        function openAddRTLModal(editItem = null) {
            const isEdit = !!editItem;
            openModal(`
                <div class="p-6">
                    <h3 class="text-lg font-extrabold text-slate-800">${isEdit ? 'Edit Rencana Kerja / RTL' : 'Tambah Rencana Kerja & RTL Baru'}</h3>
                    <form onsubmit="saveRTLForm(event, ${isEdit ? `'${editItem.id}'` : 'null'})" class="space-y-4 mt-4">

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Kategori</label>
                                <select id="rtl-kategori" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold outline-none">
                                    ${['SDM', 'Fasilitas & Alat', 'Pelayanan', 'Administrasi'].map(c => `<option ${editItem?.kategori === c ? 'selected' : ''}>${c}</option>`).join('')}

                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Judul Rencana Kerja / Program</label>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">PIC Penanggung Jawab</label>
                                <input type="text" id="rtl-pic" value="${editItem?.pic || 'Ns. Ahmad Fauzi, S.Kep'}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Dokumentasi Eviden / Bukti</label>
                                <input type="text" id="rtl-eviden" value="${editItem?.eviden || ''}" placeholder="Link foto / nomor dokumen bukti..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs outline-none">
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Simpan Rencana Kerja</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function openEditRTLModal(id) {
            const item = appData.rtls.find(r => r.id === id);
            if (item) openAddRTLModal(item);
        }

        function saveRTLForm(e, editId) {
            e.preventDefault();
            const payload = {
                kategori: document.getElementById('rtl-kategori').value,
                tenggat: document.getElementById('rtl-tenggat').value,
                judul: document.getElementById('rtl-judul').value.trim(),
                masalah: document.getElementById('rtl-masalah').value.trim(),
                tindakan: document.getElementById('rtl-tindakan').value.trim(),
                pic: document.getElementById('rtl-pic').value.trim(),
                eviden: document.getElementById('rtl-eviden').value.trim()
            };

            if (editId) {
                const idx = appData.rtls.findIndex(r => r.id === editId);
                if (idx !== -1) appData.rtls[idx] = { ...appData.rtls[idx], ...payload };
            } else {
                appData.rtls.unshift({
                    id: 'rtl' + Date.now(),
                    ...payload,
                    progres: 0,
                    status: 'Dalam Proses'
                });
            }
            saveData();
            closeModal();
            renderCurrentTab();
            showToast('Rencana kerja & RTL berhasil disimpan.');
        }

        function deleteRTL(id) {
            appData.rtls = appData.rtls.filter(r => r.id !== id);
            saveData();
            renderCurrentTab();
            showToast('Rencana kerja dihapus.', 'warning');
        }

                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${m}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${l}</td>

                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Tanggal Evaluasi</th>
                                <th class="border border-slate-400 py-2 px-3 text-center">Metode</th>
                                <th class="border border-slate-400 py-2 px-3 text-center">Sensus Pasien</th>
                                <th class="border border-slate-400 py-2 px-3 text-center">Kebutuhan (24j)</th>
                                <th class="border border-slate-400 py-2 px-3 text-center">Tersedia</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Analisis Kepala Ruangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.workloadHistory.map((w, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${w.tanggal}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center">${w.metode}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center">${w.totalPasien} Pasien</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center font-bold">${w.kebutuhan} Perawat</td>
                                    <td class="border border-slate-400 py-1.5 px-3 text-center">${w.riil} Orang</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${w.catatan}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'supervisi') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Tanggal</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Perawat Disupervisi</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Topik Tindakan</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Skor</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Temuan & Rekomendasi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.supervisions.map((s, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${s.tanggal}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${s.perawat}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${s.topik}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${s.skor}%</td>
                                    <td class="border border-slate-400 py-1.5 px-3"><strong>Temuan:</strong> ${s.temuan}<br><strong>Rekom:</strong> ${s.rekomendasi}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'mutu') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">Kode</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Indikator Mutu Ruangan</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Target</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Num/Den</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Capaian</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Analisis & Tindak Lanjut</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.qualityIndicators.map(q => {
                                const pct = q.denominator > 0 ? ((q.numerator / q.denominator) * 100).toFixed(2) : 0;
                                return `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${q.kode}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${q.nama}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${q.target}%</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${q.numerator}/${q.denominator}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${pct}%</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${q.analisis} — <em>RTL: ${q.rtl}</em></td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } else if (selectedReportType === 'rtl') {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Kategori & Program Kerja</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Rencana Tindakan</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">PIC & Tenggat</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Progres</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.rtls.map((r, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3"><strong>[${r.kategori}]</strong> ${r.judul}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${r.tindakan}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${r.pic} (${r.tenggat})</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${r.progres}% (${r.status})</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                return `
                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-400 py-2 px-2 text-center">No</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Area Audit Kepatuhan Internal</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Standar Penilaian</th>
                                <th class="border border-slate-400 py-2 px-2 text-center">Hasil</th>
                                <th class="border border-slate-400 py-2 px-3 text-left">Catatan Evaluasi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${appData.audits.map((a, i) => `
                                <tr>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center">${i + 1}</td>
                                    <td class="border border-slate-400 py-1.5 px-3 font-bold">${a.area}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${a.standar}</td>
                                    <td class="border border-slate-400 py-1.5 px-2 text-center font-bold">${a.sesuai ? 'Sesuai' : 'Perlu Perbaikan'}</td>
                                    <td class="border border-slate-400 py-1.5 px-3">${a.catatan}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        function exportSelectedReportCSV() {
            if (selectedReportType === 'jadwal') {
                exportJadwalCSV();
                return;
            }
            let csvLines = [];
            if (selectedReportType === 'sdm') {
                csvLines.push('No,Nama Lengkap,NIP,Pendidikan,Jenjang Klinis,Jabatan,No STR,Expiry STR,Status');
                appData.nurses.forEach((n, i) => {
                    csvLines.push(`${i + 1},"${n.nama}","${n.nip}","${n.pendidikan}",${n.pk},"${n.jabatan}",${n.strNo},${n.strExp},${n.status}`);
                });
            } else if (selectedReportType === 'mutu') {
                csvLines.push('Kode,Indikator Mutu,Target,Numerator,Denominator,Capaian (%),Analisis,RTL');
                appData.qualityIndicators.forEach(q => {
                    const pct = q.denominator > 0 ? ((q.numerator / q.denominator) * 100).toFixed(2) : 0;
                    csvLines.push(`${q.kode},"${q.nama}",${q.target},${q.numerator},${q.denominator},${pct},"${q.analisis}","${q.rtl}"`);
                });
            } else if (selectedReportType === 'rtl') {
                csvLines.push('Kategori,Judul Program,Permasalahan,Rencana Tindakan,PIC,Tenggat,Progres (%),Status');
                appData.rtls.forEach(r => {
                    csvLines.push(`"${r.kategori}","${r.judul}","${r.masalah}","${r.tindakan}","${r.pic}",${r.tenggat},${r.progres},${r.status}`);
                });
            } else {
                csvLines.push('Tanggal,Metode/Topik,Detail,Hasil');
                appData.supervisions.forEach(s => {
                    csvLines.push(`${s.tanggal},"${s.topik}","${s.perawat}",${s.skor}%`);
                });
            }
            downloadCSV(csvLines.join('\n'), `Laporan_Resmi_Ruang_Dahlia_${selectedReportType.toUpperCase()}_2026.csv`);
        }

        function downloadCSV(content, filename) {
            const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`File ${filename} berhasil diekspor!`);
        }

        // =========================================================================
        // 4. INITIALIZATION ON WINDOW LOAD
        // =========================================================================
        window.onload = function () {
            switchTab('dashboard');
        };
    </script>
</body>
